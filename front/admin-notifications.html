<div style="width: 100%; padding: 0.6rem 2.5rem 0.8rem 2.5rem; box-sizing: border-box; text-align: left; background-color: var(--primary-bg);">

        <a href="admin.html#dashboard" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; gap: 1rem; flex-wrap: wrap;">
                <h1 style="color: var(--primary-bg); font-family: var(--font-heading); margin: 0; font-size: 2rem;">All Admin Alerts</h1>
                <button onclick="markAllReadPage()" style="background:none;border:none;color:var(--primary-gold);cursor:pointer;font-weight:bold;font-size:1rem; padding: 0.5rem 1rem;">Mark All as Read</button>
            </div>
            
            <div id="fullNotifList">
                <div style="text-align: center; color: #666; font-size: 1.2rem; padding: 2rem;">Loading alerts...</div>
            </div>
        </div>
    </div>



    <script src="js/admin.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAllNotifications);

        async function loadAllNotifications() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await fetch('/api/notifications', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const notifs = await res.json();
                    const container = document.getElementById('fullNotifList');
                    
                    if (notifs.length === 0) {
                        container.innerHTML = '<div style="text-align: center; color: #666; padding: 2rem;">No alerts found.</div>';
                        return;
                    }

                    let html = '';
                    notifs.forEach(n => {
                        const date = new Date(n.createdAt).toLocaleString();
                        html += `
                            <a href="${n.actionUrl || '#'}" class="full-notif-item ${n.isRead ? '' : 'unread'}" onclick="markRead(${n.id})">
                                <div class="notif-title">${n.title}</div>
                                <div class="notif-msg">${n.message}</div>
                                <div class="notif-time">${date}</div>
                            </a>
                        `;
                    });
                    container.innerHTML = html;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function markAllReadPage() {
            const token = localStorage.getItem('token');
            if (!token) return;
            await fetch(`/api/notifications/read-all`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
            loadAllNotifications();
            if (typeof loadNotifications === 'function') loadNotifications(); // update badge if present
        }
    </script>
