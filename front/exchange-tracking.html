<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Replacement Tracking | LeatherLane Atelier</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/timeline.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1000px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: #333; }
        h2 { color: var(--primary-bg); font-family: var(--font-heading); margin-bottom: 1.5rem; text-align: center; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; background: #f9f9f9; padding: 1.5rem; border-radius: 8px; }
        .details-col div { margin-bottom: 0.5rem; }
        .details-label { font-weight: bold; color: #666; font-size: 0.9rem; }
        .btn-back { display: inline-block; margin-top: 1rem; padding: 8px 16px; background: #eee; color: #333; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Replacement Tracking</h2>
        
        <div id="trackingInfoCard"></div>

        <div class="details-grid" id="exchangeDetails">
            <div style="text-align: center; grid-column: 1 / -1;">Loading details...</div>
        </div>

        <h3 style="color: var(--primary-bg); font-family: var(--font-heading); margin-top: 2rem;">Exchange Timeline</h3>
        
        <div class="timeline-container">
            <ul class="timeline-horizontal" id="timeline">
                <!-- Timeline items injected here -->
            </ul>
        </div>

        <a href="transactions.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Orders</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const exchangeId = urlParams.get('id');

        function getIconForStatus(status) {
            const s = status.toLowerCase();
            if (s.includes('request')) return 'fa-exchange-alt';
            if (s.includes('review')) return 'fa-search';
            if (s.includes('approv')) return 'fa-check';
            if (s.includes('pickup')) return 'fa-calendar-check';
            if (s.includes('pick')) return 'fa-truck-pickup';
            if (s.includes('warehouse')) return 'fa-warehouse';
            if (s.includes('inspect')) return 'fa-search-plus';
            if (s.includes('prepar')) return 'fa-box-open';
            if (s.includes('ship')) return 'fa-shipping-fast';
            if (s.includes('deliver')) return 'fa-check-circle';
            if (s.includes('complet')) return 'fa-check-double';
            if (s.includes('reject') || s.includes('fail') || s.includes('cancel')) return 'fa-times-circle';
            return 'fa-circle';
        }

        async function loadTracking() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return; }

            if (!exchangeId) {
                document.getElementById('exchangeDetails').innerHTML = '<div style="color:red; grid-column:1/-1; text-align:center;">Invalid Request ID</div>';
                return;
            }

            try {
                const res = await fetch(`/api/tracking/exchange/${exchangeId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    
                    const detailsHtml = `
                        <div class="details-col">
                            <div><span class="details-label">Exchange ID:</span> #${data.exchangeId}</div>
                            <div><span class="details-label">Order ID:</span> #${data.orderId}</div>
                            <div><span class="details-label">Request Date:</span> ${new Date(data.requestDate).toLocaleDateString()}</div>
                            <div><span class="details-label">Status:</span> <strong style="color: var(--primary-gold);">${data.status}</strong></div>
                        </div>
                        <div class="details-col">
                            <div><span class="details-label">Original Item:</span> ${data.originalProduct || 'Unknown'}</div>
                            <div><span class="details-label">Requested Replacement:</span> ${data.replacementProduct || 'None'}</div>
                            <div><span class="details-label">Reason:</span> ${data.reason}</div>
                        </div>
                    `;
                    document.getElementById('exchangeDetails').innerHTML = detailsHtml;

                    let timelineHtml = '';
                    let latestTracking = null;

                    if (data.timeline && data.timeline.length > 0) {
                        data.timeline.forEach((event) => {
                            let typeClass = 'step-pending';
                            if (event.isCompleted) typeClass = 'step-completed';
                            if (event.isCurrent) typeClass = 'step-current';
                            if (event.status.toLowerCase().includes('reject') || event.status.toLowerCase().includes('fail') || event.status.toLowerCase().includes('cancel')) {
                                typeClass = 'step-rejected';
                            }

                            if (event.trackingNumber) {
                                latestTracking = event;
                            }

                            timelineHtml += `
                                <li class="timeline-step ${typeClass}">
                                    <div class="step-circle"><i class="fas ${getIconForStatus(event.status)}"></i></div>
                                    <div class="step-content">
                                        <div class="step-title">${event.status}</div>
                                        <div class="step-date">${new Date(event.eventDateTime).toLocaleString()}</div>
                                        <div class="step-desc">${event.description}</div>
                                        ${event.courierName ? `<div style="margin-top:5px; font-size:0.8rem;"><b>Courier:</b> ${event.courierName}</div>` : ''}
                                        ${event.trackingNumber ? `<div style="font-size:0.8rem;"><b>Tracking ID:</b> ${event.trackingNumber}</div>` : ''}
                                    </div>
                                </li>
                            `;
                        });
                    } else {
                        timelineHtml = '<li>No tracking history available yet.</li>';
                    }
                    document.getElementById('timeline').innerHTML = timelineHtml;

                    if (data.status === 'Waiting for Customer Return') {
                        document.getElementById('trackingInfoCard').innerHTML = `
                            <div class="tracking-card" style="background:#fff3cd; border:1px solid #ffeeba; margin-bottom: 2rem; padding: 1.5rem; border-radius: 8px;">
                                <h4 style="margin-top:0; color:#856404; font-family: var(--font-heading);">Submit Your Return Tracking Info</h4>
                                <p style="color:#856404; font-size:0.9rem; margin-bottom:1rem;">Please ship the item back to our workshop and enter the courier details below so we can track it.</p>
                                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                                    <input type="text" id="custCourier" placeholder="Courier Name (e.g. TCS)" style="padding:8px; border:1px solid #ccc; border-radius:4px; flex:1; min-width:150px;">
                                    <input type="text" id="custTracking" placeholder="Tracking Number" style="padding:8px; border:1px solid #ccc; border-radius:4px; flex:1; min-width:150px;">
                                    <button onclick="submitTracking()" style="background:var(--primary-bg); color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-weight:bold;">Submit Details</button>
                                </div>
                            </div>
                        `;
                    } else if (latestTracking && latestTracking.trackingNumber && latestTracking.status !== 'Waiting for Customer Return') {
                        const trackUrl = latestTracking.courierName.toLowerCase().includes('tcs') ? `https://www.tcsexpress.com/tracking?trackNo=${latestTracking.trackingNumber}` : '#';
                        
                        let trackingTitle = "Tracking Information";
                        let trackingExplanation = "Enter this Tracking ID on the courier website.";
                        
                        if (latestTracking.status === 'Return Shipped by Customer') {
                            trackingTitle = "Return to Seller Tracking Info";
                            trackingExplanation = "This is the tracking information for the parcel you sent back to the seller.";
                        } else if (latestTracking.status === 'Replacement Shipped') {
                            trackingTitle = "Replacement Item Tracking Info";
                            trackingExplanation = "This is the tracking information for your new replacement item.";
                        } else if (latestTracking.status === 'Original Shipped Back') {
                            trackingTitle = "Return to Customer Tracking Info";
                            trackingExplanation = "This is the tracking information for your original item being shipped back to you.";
                        } else if (latestTracking.status === 'Pickup Scheduled') {
                            trackingTitle = "Pickup Tracking Info";
                            trackingExplanation = "This is the tracking information for your scheduled pickup.";
                        }
                        
                        document.getElementById('trackingInfoCard').innerHTML = `
                            <section class="section" style="padding-top: 120px;">
        <div class="container" style="max-width: 800px; margin: 0 auto;">
            <h1 style="color: var(--primary-bg); margin-bottom: 2rem; font-family: var(--font-heading);">Replacement Tracking</h1>

            <div class="tracking-card" id="trackingContainer" style="display: none;">
                <div class="tracking-header">
                    <span style="color: #333; font-weight: 500;" id="exchangeId"></span><strong>Courier Name:</strong> ${latestTracking.courierName}</div>
                                    <div><strong>Tracking Number:</strong> ${latestTracking.trackingNumber}</div>
                                    <div style="font-size: 0.85rem; color: #666; margin-top: 5px;">${trackingExplanation}</div>
                                </div>
                                <div style="margin-top: 1rem;">
                                    <button class="track-btn" onclick="window.open('${trackUrl}', '_blank')"><i class="fas fa-search-location"></i> Track Shipment</button>
                                </div>
                            </div>
                        `;
                    }

                } else {
                    document.getElementById('exchangeDetails').innerHTML = '<div style="color:red; grid-column:1/-1; text-align:center;">Failed to load tracking data.</div>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('exchangeDetails').innerHTML = '<div style="color:red; grid-column:1/-1; text-align:center;">Connection error.</div>';
            }
        }

        async function submitTracking() {
            const courier = document.getElementById('custCourier').value.trim();
            const tracking = document.getElementById('custTracking').value.trim();
            if (!courier || !tracking) {
                alert('Please enter both courier name and tracking number.');
                return;
            }

            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/exchange/${exchangeId}/submit-tracking`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ courierName: courier, trackingNumber: tracking })
                });

                if (res.ok) {
                    alert('Tracking information submitted successfully!');
                    loadTracking();
                } else {
                    const data = await res.json();
                    alert(data.message || 'Failed to submit tracking.');
                }
            } catch (err) {
                alert('Connection error.');
            }
        }

        document.addEventListener('DOMContentLoaded', loadTracking);
    </script>
</body>
</html>
