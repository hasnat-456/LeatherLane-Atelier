<head>

    <meta property="twitter:description" content="Discover premium handcrafted leather bags, wallets, and accessories at LeatherLane Atelier. Experience timeless elegance and superior craftsmanship.">

    <!-- Canonical Link -->
    <link rel="canonical" href="https://www.leatherlaneatelier.com/">

    <title>Reset Password | LeatherLane Atelier</title>
    <link rel="stylesheet" href="css/global.css?v=1787137292685">
    <style>
        .split-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }
        
        .left-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            text-align: center;
            background-color: var(--primary-bg);
            border-right: 1px solid rgba(199, 154, 82, 0.1);
        }

        .right-pane {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--primary-bg);
            padding: 2rem;
        }

        .hero-title {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            color: var(--primary-gold);
            font-family: var(--font-heading);
            text-transform: uppercase;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--secondary-text);
            max-width: 400px;
            line-height: 1.6;
        }

        .auth-card {
            background-color: var(--secondary-bg);
            padding: 3rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: 1.5rem;
            color: var(--primary-gold);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .auth-header p {
            color: var(--light-text);
            font-size: 1.2rem;
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--light-text);
            font-size: 0.9rem;
        }

        .footer-copyright {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: var(--secondary-text);
            left: 0;
        }

        @media (max-width: 900px) {
            .split-layout {
                flex-direction: column;
            }
            .left-pane {
                display: none; /* Hide hero on small screens */
            }
        }
    </style>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LeatherLane Atelier",
      "url": "https://www.leatherlaneatelier.com",
      "logo": "https://www.leatherlaneatelier.com/images/logo.png",
      "description": "Premium handcrafted leather bags, wallets, and accessories."
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="upload/logo.svg">
</head>
<body>
    <div class="split-layout">
        <!-- Left Hero Pane -->
        <div class="left-pane slide-up">
            <h1 class="hero-title">Timeless<br>Elegance</h1>
            <p class="hero-subtitle">Discover our exclusive collection of handcrafted leather goods, designed for those who appreciate the finer things in life.</p>
        </div>
        
        <!-- Right Auth Pane -->
        <div class="right-pane fade-in">
            <div style="position: relative; width: 100%; display: flex; justify-content: center;">
                <div class="auth-card">
                    <div class="auth-header">
                        <h2>LeatherLane Atelier</h2>
                        <p>Reset Password</p>
                        <div style="margin-top: 10px; font-size: 0.85rem; color: var(--secondary-text);">Enter your new password below.</div>
                    </div>
                    
                    <form id="resetForm">
                        <div id="message" style="color: var(--primary-gold); margin-bottom: 1rem; font-size: 0.9rem; display: none; text-align: center;"></div>
                        <div class="form-group">
                            <label>New Password</label>
                            <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                        
                        <button type="submit" class="btn-primary" id="submitBtn">Update Password</button>
                    </form>
                </div>
                
                <div class="footer-copyright">
                    &copy; 2026 LeatherLane Atelier. All rights reserved.
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                const msg = document.getElementById('message');
                msg.style.display = 'block';
                msg.style.color = 'var(--error)';
                msg.innerText = "Invalid or missing reset token.";
                return;
            }

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            
            if (newPassword !== confirmPassword) {
                msg.style.display = 'block';
                msg.style.color = 'var(--error)';
                msg.innerText = "Passwords do not match.";
                return;
            }
            
            btn.innerText = 'Updating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await res.json();
                msg.style.display = 'block';
                msg.style.color = res.ok ? 'var(--primary-gold)' : 'var(--error)';
                msg.innerText = data.message || "An error occurred";
                
                if (res.ok) {
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    btn.innerText = 'Update Password';
                    btn.disabled = false;
                }
            } catch (err) {
                msg.style.display = 'block';
                msg.style.color = 'var(--error)';
                msg.innerText = "Network error. Please try again.";
                btn.innerText = 'Update Password';
                btn.disabled = false;
            }
        });
    </script>
    <script src="js/security.js?v=1787135903805"></script>
</body>
</html>
