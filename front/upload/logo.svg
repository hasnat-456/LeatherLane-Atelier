<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
    <defs>
        <style>
            .gold { fill: #cba153; }
            .gold-stroke { stroke: #cba153; stroke-linejoin: round; fill: none; }
            .logo-font { font-family: 'Times New Roman', Times, serif; font-weight: 700; fill: #cba153; }
        </style>
        
        <pattern id="diagonal" patternUnits="userSpaceOnUse" width="6" height="6">
            <line x1="0" y1="6" x2="6" y2="0" stroke="#cba153" stroke-width="2" />
        </pattern>

        <mask id="hide-cutout">
            <rect x="-50" y="-50" width="100" height="100" fill="white" />
            <path d="M -12,-12 v22 h14 v-5 h-9 v-17 Z" fill="black" />
            <path d="M 12,12 v-22 h-14 v5 h9 v17 Z" fill="black" />
        </mask>
    </defs>
    
    <!-- TOP EMBLEM -->
    <!-- Kept at same position, but moved everything else down to create space -->
    <g transform="translate(300, 50) scale(1.4)">
        <path d="M -15,-28 L 15,-28 C 22,-28 25,-25 25,-18 L 25,12 L 0,32 L -25,12 L -25,-18 C -25,-25 -22,-28 -15,-28 Z" class="gold" mask="url(#hide-cutout)" />
    </g>

    <!-- CENTER TEXT: LEATHERLANE (Curved) -->
    <!-- Moved down 30 pixels to give the top emblem breathing room -->
    <path id="curve" d="M 60,200 Q 300,100 540,200" fill="transparent" />
    <text class="logo-font" font-size="52" letter-spacing="3">
        <textPath href="#curve" startOffset="50%" text-anchor="middle">LEATHERLANE</textPath>
    </text>

    <!-- CENTER TEXT: ATELIER (Straight) -->
    <!-- Moved down 30 pixels -->
    <text class="logo-font" x="300" y="240" font-size="34" letter-spacing="8" text-anchor="middle">ATELIER</text>

    <!-- BOTTOM EMBLEM -->
    <!-- Moved down 30 pixels -->
    <g transform="translate(300, 285) scale(1.3)">
        <path d="M -16,-12 L 16,-12 L 16,0 C 16,12 8,20 0,26 C -8,20 -16,12 -16,0 Z" fill="url(#diagonal)" stroke="#cba153" stroke-width="3" />
    </g>
</svg>
