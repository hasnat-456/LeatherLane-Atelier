<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Discover premium handcrafted leather bags, wallets, and accessories at LeatherLane Atelier. Experience timeless elegance and superior craftsmanship.">
    <meta name="keywords" content="handmade Peshawari chappal, leather chappal Pakistan, handcrafted men's footwear, leather sandals Pakistan, LeatherLane Atelier">
    <meta name="author" content="LeatherLane Atelier">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://leatherlaneatelier.store/index">
    <meta property="og:title" content="LeatherLane Atelier | Premium Handcrafted Leather">
    <meta property="og:description" content="Discover premium handcrafted leather bags, wallets, and accessories at LeatherLane Atelier. Experience timeless elegance and superior craftsmanship.">
    <meta property="og:image" content="https://www.leatherlaneatelier.store/images/logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.leatherlaneatelier.store/">
    <meta property="twitter:title" content="LeatherLane Atelier | Premium Handcrafted Leather">
    <meta property="twitter:description" content="Discover premium handcrafted leather bags, wallets, and accessories at LeatherLane Atelier. Experience timeless elegance and superior craftsmanship.">
    <meta property="twitter:image" content="https://www.leatherlaneatelier.store/images/logo.png">

    <!-- Canonical Link -->
    <link rel="canonical" href="https://leatherlaneatelier.store/index">

    <title>LeatherLane Atelier | Premium Handcrafted Leather</title>
    <link rel="stylesheet" href="css/global.css?v=1787223176516">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #470C0E;
            color: var(--primary-gold, #C79A52);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            text-align: center;
            cursor: pointer;
            touch-action: pan-x pan-y;
        }

        

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .splash-logo {
            width: 800px;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            margin-bottom: 2rem;
            animation: fadeIn 1.5s ease-in-out;
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }

        .tagline {
            font-family: var(--font-heading);
            font-style: italic;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--secondary-gold);
            margin-bottom: 2rem;
            animation: slideUp 1s ease-out 0.6s both;
        }

        .sub-tagline {
            font-family: var(--font-body);
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--secondary-text);
            animation: slideUp 1s ease-out 0.9s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    
        /* Responsive Fixes for Mobile */
        @media (max-width: 768px) {
            .splash-logo {
                width: 90vw !important;
                max-width: 400px;
            }
            .tagline {
                font-size: 0.95rem;
                padding: 0 1rem;
            }
            .sub-tagline {
                font-size: 0.7rem;
                padding: 0 1rem;
            }
        }
    </style>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LeatherLane Atelier",
      "url": "https://www.leatherlaneatelier.store",
      "logo": "https://www.leatherlaneatelier.store/images/logo.png",
      "description": "Premium handcrafted leather bags, wallets, and accessories."
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="upload/logo.svg">
</head>
<body onclick="window.location.href='/home'">
    <div class="splash-container">
        <img src="upload/logo.svg" alt="LeatherLane Atelier Logo" class="splash-logo" style="object-fit: contain; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        <div class="tagline">"Crafted in Leather. Designed for Life."</div>
        <div class="sub-tagline">Premium Handcrafted Leather Goods</div>
    </div>
    
    <script>
        // Block Ctrl +/- and Ctrl+Scroll zooming

        // Auto-redirect after 4 seconds
        setTimeout(() => {
            window.location.href = '/home';
        }, 4000);
    </script>
    <script src="js/security.js?v=1787391006"></script>
</body>
</html>
