    <title>All Notifications | LeatherLane Atelier</title>
    <link rel="stylesheet" href="css/global.css?v=1787222477335">
    <style>
        .notifications-container { max-width: 800px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: #333; }
        .full-notif-item { padding: 1.5rem; background: #fff; border: 1px solid #eee; border-left: 4px solid var(--primary-gold); display: flex; flex-direction: column; text-decoration: none; color: #333; transition: background 0.2s, transform 0.2s; border-radius: 6px; margin-bottom: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .full-notif-item:hover { background: #fdfaf6; transform: translateY(-2px); }
        .full-notif-item.unread { background: #f0f7f4; }
        .btn-dashboard { display: inline-block; margin-bottom: 1.5rem; padding: 10px 20px; background: #111; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; font-family: 'Poppins', sans-serif; transition: background 0.3s; border: none; cursor: pointer; }
        .btn-dashboard:hover { background: #333; }
        .notif-title { font-weight: bold; font-size: 1.1rem; color: var(--primary-bg); margin-bottom: 5px; }
        .notif-msg { font-size: 0.95rem; color: #555; }
        .notif-time { font-size: 0.8rem; color: #888; margin-top: 10px; }
    </style>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LeatherLane Atelier",
      "url": "https://www.leatherlaneatelier.com",
      "logo": "https://www.leatherlaneatelier.com/images/logo.png",
      "description": "Premium handcrafted leather bags, wallets, and accessories."
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="upload/logo.svg">

    

    

    


    


    <!-- ULTIMATE UI FIXES V3 -->
    <style>
        /* 1. Prevent Navbar from EVER overlapping content */
        .navbar {
            position: relative !important; 
            top: auto !important;
            z-index: 100 !important; /* Low enough so modals (z-index 1100) cover it! */
        }
        
        /* 2. Remove the ugly 120px bottom gap */
        html { padding-bottom: 0 !important; overflow-x: hidden !important; max-width: 100vw !important; }
        body { padding-bottom: 0 !important; overflow-x: hidden !important; max-width: 100vw !important; }
        
        /* 3. Elegantly prevent WhatsApp from blocking footer text WITHOUT a bottom gap */
        
        
        /* 4. Fix Password Toggle Overlap */
        input[type="password"], 
        input[id*="password"], 
        input[id*="Password"],
        .password-wrapper input,
        .form-control[id="password"] {
            padding-right: 85px !important;
        }
        
        /* 5. Fix Table Empty States getting cut off */
        td[colspan], 
        th[colspan] {
            white-space: normal !important;
            word-wrap: break-word !important;
            overflow-wrap: break-word !important;
            min-width: 100% !important;
            display: table-cell !important;
        }
        table { max-width: 100% !important; }

        /* 6. FIX HORIZONTAL OVERFLOW SCROLLING */
        .size-options { flex-wrap: wrap !important; }
        .row { flex-wrap: wrap !important; }
        .row > .form-group { min-width: 100% !important; }
        .footer-bottom { flex-wrap: wrap !important; gap: 1rem !important; }
        #newsletter-form { flex-wrap: wrap !important; }
        #newsletter-form input { min-width: 60% !important; }
        #newsletter-form button { flex-grow: 1 !important; }
        
        @media (min-width: 769px) {
            .row > .form-group { min-width: 0 !important; }
        }
    </style>


    <!-- V4 FIXES -->
    <style>
        @media (max-width: 768px) {
            .footer-bottom {
                flex-direction: column !important;
                align-items: center !important;
                text-align: center !important;
                gap: 15px !important;
                padding-right: 0 !important;
                padding-bottom: 40px !important; 
            }
            .footer-bottom-links {
                display: flex !important;
                flex-direction: column !important;
                gap: 10px !important;
                margin-left: 0 !important;
            }
            .footer-bottom-links a {
                margin: 0 !important;
            }
        }
    </style>


    <!-- V5 OVERFLOW & BOX-SIZING FIXES -->
    <style>
        /* Force box-sizing on all inputs to prevent padding from expanding width */
        *, *::before, *::after, input, textarea, select, button, .form-control, .form-group {
            box-sizing: border-box !important;
        }
        
        /* Ensure inputs never exceed their container */
        input, textarea, select {
            max-width: 100% !important;
        }
        
        @media (max-width: 768px) {
            /* Add explicit padding to right side of containers to guarantee gap */
            .profile-container, .container, .detail-container, .checkout-grid {
                padding-left: 20px !important;
                padding-right: 20px !important;
                width: 100% !important;
                max-width: 100vw !important;
            }
            
            /* Ensure rows don't overflow */
            .row {
                margin-left: 0 !important;
                margin-right: 0 !important;
                width: 100% !important;
            }
            
            /* Profile Header specific fix */
            .profile-header {
                max-width: 100% !important;
            }
        }
    </style>


    <!-- V6 CARD MARGIN FIX -->
    <style>
        @media (max-width: 768px) {
            /* Force the white cards to NOT touch the edges of the phone screen */
            .profile-container, 
            .auth-container, 
            .checkout-grid, 
            .detail-container, 
            .card {
                width: calc(100% - 32px) !important;
                margin-left: 16px !important;
                margin-right: 16px !important;
                border-radius: 8px !important;
            }
        }
    </style>

</head>
<body>
    <nav class="navbar" style="background-color: var(--primary-bg); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;">
        <div class="nav-brand">
            <a href="home.html" style="display: flex; align-items: center; text-decoration: none;">
                <img src="upload/logo.svg" alt="LeatherLane Atelier Logo" style="height: 65px; object-fit: contain; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            </a>
        </div>
        <div class="nav-links" style="display: flex; gap: 1.5rem; align-items: center;">
            <!-- Links loaded by auth.js -->
        </div>
    </nav>

    <div class="main-section" style="background: #F5EFE7; padding: 2rem 0; flex: 1;">
        <div style="max-width: 800px; margin: 0 auto; text-align: left;">
            <a href="home.html" class="btn-dashboard" style="margin-bottom: 0;">&larr; BACK TO HOME</a>
        </div>
        <div class="container">
            <div class="notifications-container" style="margin-top: 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2 style="color: var(--primary-bg); font-size: 2rem; margin: 0;">All Notifications</h2>
                    <button onclick="markAllReadPage()" style="background:none;border:none;color:var(--primary-gold);cursor:pointer;font-weight:bold;font-size:1rem;">Mark All as Read</button>
                </div>
                <div id="fullNotifList">
                    <div style="text-align: center; color: #666; font-size: 1.2rem; padding: 2rem;">Loading notifications...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js?v=1787222477335"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAllNotifications);

        async function loadAllNotifications() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await fetch('/api/notifications', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const notifs = await res.json();
                    const container = document.getElementById('fullNotifList');
                    
                    if (notifs.length === 0) {
                        container.innerHTML = '<div style="text-align: center; color: #666; padding: 2rem;">You have no notifications.</div>';
                        return;
                    }

                    let html = '';
                    notifs.forEach(n => {
                        const date = new Date(n.createdAt).toLocaleString();
                        html += `
                            <a href="${n.actionUrl || '#'}" class="full-notif-item ${n.isRead ? '' : 'unread'}" onclick="markRead(${n.id})">
                                <div class="notif-title">${n.title}</div>
                                <div class="notif-msg">${n.message}</div>
                                <div class="notif-time">${date}</div>
                            </a>
                        `;
                    });
                    container.innerHTML = html;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function markAllReadPage() {
            const token = localStorage.getItem('token');
            if (!token) return;
            await fetch(`/api/notifications/read-all`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
            loadAllNotifications();
            // also trigger auth.js badge update
            if (typeof loadNotifications === 'function') loadNotifications();
        }
    </script>
    <script src="js/security.js?v=1787222477335"></script>
</body>
</html>
