<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LeatherLane Atelier | Premium Handcrafted Leather</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--primary-bg, #2B1D17);
            color: var(--primary-gold, #C79A52);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            cursor: pointer;
            touch-action: pan-x pan-y;
        }

        @media (min-width: 1024px) {
            body {
                zoom: 0.8;
                height: 125vh;
            }
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            border: 2px solid var(--primary-gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            animation: fadeIn 1.5s ease-in-out;
        }

        .logo-circle span {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
            padding-top: 5px;
        }

        .brand-name {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            animation: slideUp 1s ease-out 0.3s both;
        }

        .tagline {
            font-family: var(--font-heading);
            font-style: italic;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--secondary-gold);
            margin-bottom: 2rem;
            animation: slideUp 1s ease-out 0.6s both;
        }

        .sub-tagline {
            font-family: var(--font-body);
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--secondary-text);
            animation: slideUp 1s ease-out 0.9s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body onclick="window.location.href='home.html'">
    <div class="splash-container">
        <div class="logo-circle">
            <span>L</span>
        </div>
        <div class="brand-name">LeatherLane Atelier</div>
        <div class="tagline">"Crafted in Leather. Designed for Life."</div>
        <div class="sub-tagline">Premium Handcrafted Leather Goods</div>
    </div>
    
    <script>
        // Block Ctrl +/- and Ctrl+Scroll zooming
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey === true && (event.key === '+' || event.key === '-' || event.key === '=' || event.keyCode === 187 || event.keyCode === 189)) {
                event.preventDefault();
            }
        });
        document.addEventListener('wheel', function(event) {
            if (event.ctrlKey === true) {
                event.preventDefault();
            }
        }, { passive: false });

        // Block pinch-to-zoom on mobile
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        // Auto-redirect after 4 seconds
        setTimeout(() => {
            window.location.href = 'home.html';
        }, 4000);
    </script>
</body>
</html>
