<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password | LeatherLane Atelier</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .auth-container {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(rgba(43, 29, 23, 0.9), rgba(43, 29, 23, 0.9)), url('https://images.unsplash.com/photo-1614252235316-df873dc3d63b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1200&q=80') center/cover;
        }
        .auth-card {
            background-color: var(--secondary-bg);
            padding: 3rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .auth-card h2 {
            margin-bottom: 0.5rem;
            color: var(--primary-gold);
        }
        .auth-card p {
            color: var(--secondary-text);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card slide-up">
            <h2>Reset Password</h2>
            <p>Enter your new password below.</p>
            
            <form id="resetForm">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" class="form-control" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required placeholder="••••••••">
                </div>
                
                <div id="message" style="color: var(--primary-gold); margin-bottom: 15px; font-size: 0.9rem; display: none;"></div>

                <button type="submit" class="btn-primary" id="submitBtn">Update Password</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                const msg = document.getElementById('message');
                msg.style.display = 'block';
                msg.style.color = 'var(--error)';
                msg.innerText = "Invalid or missing reset token.";
                return;
            }

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            
            if (newPassword !== confirmPassword) {
                msg.style.display = 'block';
                msg.style.color = 'var(--error)';
                msg.innerText = "Passwords do not match.";
                return;
            }
            
            btn.innerText = 'Updating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await res.json();
                msg.style.display = 'block';
                msg.style.color = res.ok ? 'var(--primary-gold)' : 'var(--error)';
                msg.innerText = data.message || "An error occurred";
                
                if (res.ok) {
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    btn.innerText = 'Update Password';
                    btn.disabled = false;
                }
            } catch (err) {
                msg.style.display = 'block';
                msg.style.color = 'var(--error)';
                msg.innerText = "Network error. Please try again.";
                btn.innerText = 'Update Password';
                btn.disabled = false;
            }
        });

        // Block Ctrl +/- and Ctrl+Scroll zooming
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey === true && (event.key === '+' || event.key === '-' || event.key === '=' || event.keyCode === 187 || event.keyCode === 189)) {
                event.preventDefault();
            }
        });
        document.addEventListener('wheel', function(event) {
            if (event.ctrlKey === true) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
